user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/streamlit_error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    proxy_buffering off;

    upstream weather_app {
        server 127.0.0.1:8501;
    }

    upstream monitor_app {
        server 127.0.0.1:8600;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Redirect /monitor to include trailing slash for proper Streamlit static routing
        location = /monitor {
            return 301 /monitor/;
        }

        location /monitor/ {
            proxy_pass http://monitor_app/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
            client_max_body_size 100M;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://weather_app/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
            client_max_body_size 100M;
            proxy_buffering off;
        }

        access_log /var/log/nginx/streamlit_access.log;
        error_log /var/log/nginx/streamlit_error.log warn;
    }
}
